<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#444444"/>
    </marker>
    <marker id="arrS" markerWidth="10" markerHeight="10" refX="7.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8A6A4E"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#888888"/>
    </marker>
  </defs>

  <!-- fundal alb -->
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>

  <!-- ============ LEGATURI PLINE (ortogonale) ============ -->
  <!-- Cloudflare -> ALB -->
  <path d="M360,58 V82" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- ALB -> Target group -->
  <path d="M360,120 V148" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- ALB -> Regula listener (ramura stanga) -->
  <path d="M240,102 H140 V146" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Target group -> magistrala -> 3 instante EC2 -->
  <path d="M360,188 V298" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M360,288 H270 V298" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M360,288 H450 V298" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ LEGATURI PUNCTATE ============ -->
  <!-- EC2 (dreapta) -> S3 (sienna, dash 6,9) -->
  <path d="M490,306 H613" fill="none" stroke="#8A6A4E" stroke-width="1.5" stroke-dasharray="6,9" marker-end="url(#arrS)"/>
  <text x="552" y="296" text-anchor="middle" fill="#666666" font-size="11" font-style="italic">descarcă JAR la pornire</text>
  <!-- ASG -> IAM role (punctata subtire) -->
  <path d="M510,358 H613" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="3,4" marker-end="url(#arrG)"/>
  <text x="561" y="350" text-anchor="middle" fill="#666666" font-size="11">rol atașat</text>
  <!-- Security group -> ASG (punctata) -->
  <path d="M160,320 H208" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="3,4" marker-end="url(#arrG)"/>

  <!-- ============ GRUP ASG ============ -->
  <rect x="210" y="250" width="300" height="128" rx="8" fill="none" stroke="#BBBBBB" stroke-width="1"/>
  <text x="222" y="270" fill="#888888" font-size="12" font-style="italic">Auto Scaling Group</text>

  <!-- 3 instante EC2 -->
  <rect x="230" y="298" width="80" height="48" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="270" y="322" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">Instanță EC2</text>

  <rect x="320" y="298" width="80" height="48" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="360" y="322" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">Instanță EC2</text>

  <rect x="410" y="298" width="80" height="48" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="450" y="322" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">Instanță EC2</text>

  <!-- ============ CUTII PRINCIPALE (albastru) ============ -->
  <!-- Cloudflare -->
  <rect x="265" y="22" width="190" height="36" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="360" y="40" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">Cloudflare</text>

  <!-- ALB regional (partajat) -->
  <rect x="240" y="84" width="240" height="36" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="360" y="102" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">ALB</text>

  <!-- Regula listener (pe host) -->
  <rect x="70" y="146" width="140" height="44" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="140" y="161" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">Regulă listener</text>
  <text x="140" y="176" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">(pe baza de host)</text>

  <!-- Target group -->
  <rect x="290" y="148" width="140" height="40" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="360" y="168" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">Target group</text>

  <!-- Security group (stanga) -->
  <rect x="40" y="300" width="120" height="40" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="100" y="320" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">Security group</text>

  <!-- ============ CUTII SIENNA (stocare / identitate) ============ -->
  <!-- S3 (artefact JAR) -->
  <rect x="613" y="274" width="150" height="40" rx="8" fill="#E6DACB" stroke="#8A6A4E" stroke-width="1.2"/>
  <text x="688" y="294" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">S3 (artefact JAR)</text>

  <!-- IAM role -->
  <rect x="613" y="338" width="150" height="40" rx="8" fill="#E6DACB" stroke="#8A6A4E" stroke-width="1.2"/>
  <text x="688" y="358" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="12">IAM role</text>
</svg>
