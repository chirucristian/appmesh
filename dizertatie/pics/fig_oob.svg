<svg viewBox="0 0 820 290" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#444444"/>
    </marker>
    <marker id="arrV" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8A6A4E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="290" fill="#ffffff"/>

  <!-- 1. actiune: QA -> Consola -->
  <path d="M185,120 C250,80 270,70 325,68" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="250" y="78" text-anchor="middle" font-size="11" fill="#444444">1. acțiune</text>

  <!-- 2. provizioneaza: Consola -> Resurse -->
  <path d="M505,72 C570,80 590,110 612,135" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="585" y="92" text-anchor="middle" font-size="11" fill="#444444">2. provizionează</text>

  <!-- 3. verificare independenta: QA -> Resurse (dashed, sienna) -->
  <path d="M185,170 C360,235 470,225 612,195" fill="none" stroke="#8A6A4E" stroke-width="1.6" stroke-dasharray="6,6" marker-end="url(#arrV)"/>
  <text x="400" y="252" text-anchor="middle" font-size="11" fill="#8A6A4E">3. verificare independentă (out-of-band)</text>

  <!-- Suita QA -->
  <rect x="30" y="118" width="155" height="64" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="107" y="143" text-anchor="middle" font-size="13" font-weight="600" fill="#000000">Suită QA</text>
  <text x="107" y="162" text-anchor="middle" font-size="11" fill="#333333">(4 faze)</text>

  <!-- Consola -->
  <rect x="325" y="38" width="180" height="58" rx="8" fill="#D5E0EC" stroke="#3F5E84" stroke-width="1.2"/>
  <text x="415" y="63" text-anchor="middle" font-size="13" fill="#000000">Consolă AppMesh</text>
  <text x="415" y="81" text-anchor="middle" font-size="11" fill="#333333">(API HTTP)</text>

  <!-- Resurse cloud -->
  <rect x="612" y="110" width="186" height="120" rx="8" fill="#E6DACB" stroke="#8A6A4E" stroke-width="1.2"/>
  <text x="705" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#000000">Resurse cloud</text>
  <line x1="624" y1="142" x2="786" y2="142" stroke="#C7B49A" stroke-width="1"/>
  <text x="705" y="162" text-anchor="middle" font-size="11" fill="#333333">AWS (CLI)</text>
  <text x="705" y="181" text-anchor="middle" font-size="11" fill="#333333">Cloudflare (API)</text>
  <text x="705" y="200" text-anchor="middle" font-size="11" fill="#333333">S3 (config rutare)</text>
  <text x="705" y="219" text-anchor="middle" font-size="11" fill="#333333">DynamoDB (stare)</text>
</svg>
